name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java ${{ matrix.java }} contract and consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Select test runtime
        run: echo "TEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify library, API compatibility and independent consumers
        run: sh ./verify-consumers.sh candidate
      - name: Preserve test reports, coverage and documentation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: java-${{ matrix.java }}-verification
          retention-days: 14
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/reports/jacoco/
            build/libs/*-javadoc.jar
            build/libs/*-sources.jar
            build/consumer-results/
            build/compatibility/*-api.txt
